# Robot configuration. Edit values here, not in the code.

[motors]
# BCM GPIO numbers — mapping verified with the gpiozero Robot test.
# ENA/ENB are held HIGH, speed is PWM on the direction pins.
ena = 12
enb = 13
left_forward   = 5
left_backward  = 6
right_forward  = 21
right_backward = 20
invert_left  = false    # set true if the left side runs backwards
invert_right = false
max_speed    = 1.0      # cap on any command (0..1)
# Straight-line balance. Robot curves LEFT -> make trim positive (slows the right side).
# Robot curves RIGHT -> make it negative (slows the left side). Tune with tools/trim_test.py.
trim         = 0.35

[lidar]
port      = "/dev/ttyUSB0"
baud      = 115200
frequency = 7.0          # X2 spins at a fixed ~7 Hz
sample_rate = 3          # kHz
motor_dtr = false        # let the SDK control the motor via DTR (false if it spins too fast)
min_range = 0.12         # m, ignore closer returns (chassis, standoffs)
max_range = 8.0          # m
# Robot convention: angle 0 = straight ahead, positive = to the LEFT (counter-clockwise).
# Adjust these with tools/test_lidar.py:
angle_offset_deg = 0.0   # rotate the scan so a box in front reads "front"
flip = true              # true if left and right come out swapped

[robot]
length = 0.32            # m, front-to-back (MDF plate)
width  = 0.28            # m, side-to-side incl. wheels

[safety]
stop_distance = 0.20     # m from the front (or rear) EDGE of the robot to the obstacle
slow_distance = 0.60     # start slowing down inside this

[drive]
max_speed  = 0.5         # joystick full forward = this motor command (0..1)
turn_speed = 0.45        # joystick full sideways = this turn command
manual_timeout = 0.5     # s without a joystick message -> stop (phone locked, Wi-Fi drop)
lidar_timeout  = 0.6     # s without a lidar scan -> stop

[web]
port = 8080

[slam]
resolution = 0.05            # m per map cell
size_m     = 40.0            # map is size_m x size_m, robot starts in the middle
search_xy  = 0.35            # m, how far a scan may move between two scans
search_theta_deg = 30.0      # deg, how far it may turn between two scans
min_points = 60
prior_weight = 0.03          # how much to trust the 'keep moving like before' guess (small = trust lidar)
update_dist = 0.05           # add a scan to the map after moving this much…
update_angle_deg = 4.0       # …or turning this much
max_turn_for_mapping = 0.6   # rad/s; faster turns smear the 3.3 Hz scans -> not mapped

[planner]
resolution = 0.10        # m per cell for route planning (coarser than the map = faster)
inflation  = 0.03        # extra clearance on top of the robot's turning radius

[nav]
speed        = 0.35      # forward motor command while driving to a goal (0..1)
turn_speed   = 0.40      # max turn command
turn_gain    = 1.0       # turn command per radian of heading error
turn_in_place = 0.8      # rad: if the target is this far off to the side, spin first
lookahead    = 0.40      # m: aim at the path point this far ahead
goal_tolerance = 0.15    # m: close enough = arrived
replan_period  = 2.0     # s
stuck_time     = 5.0     # s of trying without moving -> back up and retry
live_range     = 3.0     # m: obstacles from the current scan within this range block the route
wait_for_clear = 4.0     # s: blocked with no way around -> wait this long for a person to move, then back up

[explore]                # used in Step 6
min_frontier_size = 4
blacklist_radius  = 0.5

[ukf]
# The UKF learns how fast the robot really drives/turns per unit of motor command.
init_speed_gain     = 0.5    # m/s at full forward command (starting guess, learned while driving)
init_turn_gain      = 2.0    # rad/s at full turn command (starting guess, learned while driving)
slip_noise          = 0.10   # m/s: motion the model doesn't explain (slip, bumps)
yaw_slip_noise      = 0.35   # rad/s: rotation the model doesn't explain
gain_noise          = 0.05   # per s: how quickly the learned gains may drift
meas_pos_noise      = 0.03   # m: scan-match position noise (at 100 % match quality)
meas_angle_noise_deg = 1.5   # deg: scan-match heading noise
gate                = 16.0   # reject scan matches further than this (Mahalanobis^2, 3 dof)

[camera]
enabled = true
device  = 0              # /dev/video0
width   = 640
height  = 480
fps     = 15
quality = 70             # JPEG quality for the stream
