# Robot configuration. Edit values here, not in the code.

[motors]
# BCM GPIO numbers — mapping verified with the gpiozero Robot test.
# ENA/ENB are held HIGH, speed is PWM on the direction pins.
ena = 12
enb = 13
left_forward   = 5
left_backward  = 6
right_forward  = 21
right_backward = 20
invert_left  = false    # set true if the left side runs backwards
invert_right = false
max_speed    = 1.0      # cap on any command (0..1)

[lidar]
port      = "/dev/ttyUSB0"
baud      = 115200
frequency = 7.0          # X2 spins at a fixed ~7 Hz
sample_rate = 3          # kHz
min_range = 0.12         # m, ignore closer returns (chassis, standoffs)
max_range = 8.0          # m
# Robot convention: angle 0 = straight ahead, positive = to the LEFT (counter-clockwise).
# Adjust these with tools/test_lidar.py:
angle_offset_deg = 0.0   # rotate the scan so a box in front reads "front"
flip = false             # true if left and right come out swapped

[robot]
length = 0.32            # m, front-to-back (MDF plate)
width  = 0.28            # m, side-to-side incl. wheels

[safety]
stop_distance = 0.20     # m from the FRONT EDGE of the robot to the obstacle
slow_distance = 0.60     # start slowing down inside this
